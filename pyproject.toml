[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlmind"
version = "1.0.0"
description = "Responsible async web crawler and LLM-assisted data intelligence engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CrawlMind Contributors" }]
keywords = ["web-crawler", "async", "llm", "rag", "aiohttp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "aiohttp>=3.9,<4",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "aiosqlite>=0.20",
  "python-dotenv>=1.0",
  "protego>=0.3",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
]

[project.optional-dependencies]
js    = ["playwright>=1.44"]
mcp   = ["mcp>=1.0"]
embed = ["numpy>=1.26", "sentence-transformers>=2.7"]
dev   = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "aioresponses>=0.7.6",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
crawlmind = "Utilities.cli:app"

[tool.setuptools.packages.find]
include = ["Crawler*", "Parser*", "Exporter*", "Intelligence*", "Utilities*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=Crawler --cov=Parser --cov=Exporter --cov=Utilities --cov=Intelligence --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["Crawler/js_fetcher.py", "Intelligence/mcp_server.py", "Intelligence/embedding_service.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
